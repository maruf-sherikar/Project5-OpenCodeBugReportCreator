<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Documentation Generator</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--container-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #475569;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 0.75rem;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.875rem;
            color: #334155;
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 1.5rem;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }
        
        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #status-area {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
            font-weight: 500;
        }

        .status-loading {
            background-color: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
            display: block !important;
        }

        .status-success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
            display: block !important;
        }

        .status-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            display: block !important;
        }

        #download-links {
            margin-top: 1.5rem;
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            padding: 1rem;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .download-link {
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            transition: border-color 0.2s;
        }

        .download-link:hover {
            border-color: var(--primary);
        }

        .download-link::before {
            content: "📄";
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>API Documentation Generator</h1>
        
        <label for="json-input">API JSON Payload</label>
        <textarea id="json-input" placeholder='{\n  "api_name": "My API",\n  "endpoints": []\n}'></textarea>
        
        <button id="generate-btn" onclick="generateDocs()">Generate Documentation</button>

        <div id="status-area"></div>
        
        <div id="download-links">
            <h3 style="margin-top: 0; margin-bottom: 0.5rem; font-size: 1rem;">Generated Assets:</h3>
            <div id="links-container"></div>
        </div>
    </div>

    <script>
        async function generateDocs() {
            const inputEl = document.getElementById('json-input');
            const btnEl = document.getElementById('generate-btn');
            const statusArea = document.getElementById('status-area');
            const downloadArea = document.getElementById('download-links');
            const linksContainer = document.getElementById('links-container');

            // Reset UI
            statusArea.className = 'status-loading';
            statusArea.textContent = 'Engine Running: Validating and Transforming data...';
            downloadArea.style.display = 'none';
            linksContainer.innerHTML = '';
            btnEl.disabled = true;

            let payload;
            try {
                payload = JSON.parse(inputEl.value);
            } catch (e) {
                statusArea.className = 'status-error';
                statusArea.textContent = 'Invalid JSON: Please provide a valid JSON object.';
                btnEl.disabled = false;
                return;
            }

            try {
                const response = await fetch('/generate-docs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.status === 'SUCCESS') {
                    statusArea.className = 'status-success';
                    statusArea.textContent = 'Verification Complete. Engine generated outputs successfully.';
                    
                    data.files.forEach(file => {
                        const a = document.createElement('a');
                        a.href = `/download/${file}`;
                        a.className = 'download-link';
                        a.textContent = file;
                        a.download = file;
                        linksContainer.appendChild(a);
                    });
                    
                    downloadArea.style.display = 'flex';
                } else {
                    throw new Error(data.detail || data.message || 'Unknown Error running Engine');
                }
            } catch (e) {
                statusArea.className = 'status-error';
                statusArea.textContent = `Execution Failed: ${e.message}`;
            } finally {
                btnEl.disabled = false;
            }
        }
    </script>
</body>
</html>
